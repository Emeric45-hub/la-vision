name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lecteur du semainier (données fictives)
        run: node tests/semainier.test.mjs
      - name: Moteur de règles (famille fictive)
        run: node tests/moteur.test.mjs
      - name: Module assistante maternelle (créneaux fictifs)
        run: node tests/nounou.test.mjs
      - name: Grille mensuelle (famille fictive)
        run: node tests/grille.test.mjs
      - name: Fraîcheur des sources
        run: node tests/fraicheur.test.mjs
      - name: Météo (prévisions fictives)
        run: node tests/meteo.test.mjs
      - name: Compte à rebours
        run: node tests/rebours.test.mjs
      - name: Données du Raccourci iOS (fictives)
        run: node tests/raccourci.test.mjs
      - name: Post-it (codage des traits)
        run: node tests/postit.test.mjs
      - name: Menus de la cantine (texte fictif)
        run: node tests/cantine.test.mjs
      - name: Plan repas (positions fictives)
        run: node tests/repas.test.mjs
      - name: Dépendances de la tâche
        working-directory: tache
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Lecture des agendas (données fictives)
        env:
          TZ: UTC
        run: node tests/agendas.test.mjs
