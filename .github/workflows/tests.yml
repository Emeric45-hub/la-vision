name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lecteur du semainier (données fictives)
        run: node tests/semainier.test.mjs
      - name: Dépendances de la tâche
        working-directory: tache
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Lecture des agendas (données fictives)
        env:
          TZ: UTC
        run: node tests/agendas.test.mjs
